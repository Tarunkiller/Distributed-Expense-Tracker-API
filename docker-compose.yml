version: '3.8'

services:
  api:
    build: .
    container_name: expense_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=expense_db
      - DB_PORT=5432
      - JWT_SECRET=supersecretkey
      - PORT=8080
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: expense_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=expense_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
